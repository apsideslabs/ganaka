# Cloudflare Worker + D1 for village-level place search.
#
#   npx wrangler d1 create ganaka-places
#   # copy the returned database_id into the binding below
#   npx wrangler d1 execute ganaka-places --remote --file=worker/schema.sql
#   node worker/import-india.mjs --zip ./allCountries.zip --country IN --out ./sql
#   for f in sql/*.sql; do npx wrangler d1 execute ganaka-places --remote --file "$f"; done
#   npx wrangler deploy worker/src/index.ts --name ganaka-places

name = "ganaka-places"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "ganaka-places"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# Comma-separated origins allowed to call the Worker from a browser.
ALLOWED_ORIGINS = "https://apsideslabs.github.io"

[observability]
enabled = true
