name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          changed, missing = [], []

          def patch(path, pairs):
              """Idempotent: if old text is gone but new text is present, fine."""
              p = pathlib.Path(path)
              if not p.exists():
                  missing.append(f'{path} (not found)')
                  return
              s = p.read_text()
              orig = s
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new)
                  elif new not in s:
                      missing.append(f'{path}: {old[:70]!r}')
              if s != orig:
                  p.write_text(s)
                  changed.append(path)

          mp = pathlib.Path('components/matching/MatchingWorkspaceClient.tsx')
          if mp.exists() and 'isoToDate' not in mp.read_text():
              helpers = '''
          function isoToDate(iso: string): Date | null {
            if (!iso) return null;
            const [y, m, d] = iso.split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d, 12, 0, 0);
          }

          function dateToIso(date: Date | null): string {
            if (!date) return '';
            const pad = (n: number) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
          }
          '''
              s = mp.read_text()
              s = s.replace('export function MatchingWorkspaceClient',
                            helpers + '\nexport function MatchingWorkspaceClient', 1)
              s = s.replace('<GanakaDatePicker value={groomDate} onChange={setGroomDate} />',
                            '<GanakaDatePicker value={isoToDate(groomDate)} onChange={(d) => setGroomDate(dateToIso(d))} />')
              s = s.replace('<GanakaDatePicker value={brideDate} onChange={setBrideDate} />',
                            '<GanakaDatePicker value={isoToDate(brideDate)} onChange={(d) => setBrideDate(dateToIso(d))} />')
              mp.write_text(s)
              changed.append(str(mp))

          patch('lib/astronomy/coordinates.ts', [
              ("""  const q = query.toLowerCase().trim();
            return CITIES_DATABASE.filter(
              (c) =>
                c.name.toLowerCase().includes(q) ||
                c.country.toLowerCase().includes(q)
            );""",
               """  const q = query.toLowerCase().trim();
            const indexed = searchIndexedCities(q, 40);
            if (indexed.length > 0) return indexed;
            return CITIES_DATABASE.filter(
              (c) =>
                c.name.toLowerCase().includes(q) ||
                c.country.toLowerCase().includes(q)
            );"""),
          ])

          co = pathlib.Path('lib/astronomy/coordinates.ts')
          if co.exists():
              s = co.read_text()
              imp = "import { searchIndexedCities } from './city-index';"
              n_before = s.count(imp)
              s = re.sub(r"import \{ searchIndexedCities \} from '\./city-index';\s*", '', s)
              s = imp + '\n' + s
              if s.count(imp) != 1:
                  print('::error::failed to normalise city-index import')
                  sys.exit(1)
              if n_before != 1:
                  co.write_text(s)
                  changed.append('lib/astronomy/coordinates.ts (import normalised)')
                  print(f'import occurrences before: {n_before}, now: 1')

          gi = pathlib.Path('.gitignore')
          if gi.exists():
              t = gi.read_text()
              if 'public/data/' not in t:
                  gi.write_text(t.rstrip() + '\npublic/data/\n')
                  changed.append('.gitignore')

          print('changed:', changed or 'none')
          for m in missing:
              print(f'::warning::pattern not found -> {m}')
          PY

      - name: Download GeoNames dumps
        run: |
          mkdir -p /tmp/gn && cd /tmp/gn
          base=https://download.geonames.org/export/dump
          for f in cities5000 cities1000 cities500; do
            curl -sSL --retry 3 --max-time 300 -o $f.zip $base/$f.zip
            unzip -oq $f.zip
          done
          for f in admin1CodesASCII.txt countryInfo.txt timeZones.txt; do
            curl -sSL --retry 3 --max-time 90 -o $f $base/$f
          done
          ls -lh *.txt

      - name: Build city index
        run: GN_DIR=/tmp/gn node scripts/build-cities.mjs

      - name: Record index stats
        run: |
          node -e "
          const fs=require('fs');
          const f=require('./public/data/cities.json');
          const bytes=fs.statSync('public/data/cities.json').size;
          const india=f.cities.filter(c=>c[2]==='India').length;
          const alts=f.cities.filter(c=>c[8]).length;
          const stats={version:f.v,places:f.cities.length,indiaPlaces:india,withAlternateNames:alts,timezones:f.tz.length,bytes,generated:new Date().toISOString(),source:'GeoNames cities5000 + India cities1000/cities500 (CC BY 4.0)'};
          fs.writeFileSync('CITY-INDEX.json', JSON.stringify(stats,null,2)+'\n');
          console.log(stats);
          "

      - name: Commit source fixes and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(search): refresh city index stats"
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes
        run: rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "Build exited with $code"
            tail -40 build.log
            tail -80 build.log | grep -vE '^\s*$' | tail -14 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit $code
          fi
          tail -20 build.log

      - name: Verify the index shipped
        run: |
          ls -lh out/data/ || true
          node -e "const f=require('./out/data/cities.json');console.log('deployed index places:',f.cities.length,'version',f.v)"

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          du -sh out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
