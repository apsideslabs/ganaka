name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('components/matching/MatchingWorkspaceClient.tsx')
          s = p.read_text()
          if 'isoToDate' in s:
              print('already patched')
              sys.exit(0)

          helpers = '''
          function isoToDate(iso: string): Date | null {
            if (!iso) return null;
            const [y, m, d] = iso.split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d, 12, 0, 0);
          }

          function dateToIso(date: Date | null): string {
            if (!date) return '';
            const pad = (n: number) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
          }
          '''

          s = s.replace('export function MatchingWorkspaceClient',
                        helpers + '\nexport function MatchingWorkspaceClient', 1)
          s = s.replace(
              '<GanakaDatePicker value={groomDate} onChange={setGroomDate} />',
              '<GanakaDatePicker value={isoToDate(groomDate)} onChange={(d) => setGroomDate(dateToIso(d))} />')
          s = s.replace(
              '<GanakaDatePicker value={brideDate} onChange={setBrideDate} />',
              '<GanakaDatePicker value={isoToDate(brideDate)} onChange={(d) => setBrideDate(dateToIso(d))} />')
          p.write_text(s)
          print('patched MatchingWorkspaceClient')
          PY

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no source changes needed"
          else
            git add -A
            git commit -m "fix(matching): coerce ISO date strings to Date for GanakaDatePicker

            MatchingWorkspaceClient held groom/bride dates as ISO strings but passed
            them straight into GanakaDatePicker, which calls value.getFullYear().
            That threw TypeError on render (prerender and client alike), and the
            onChange handed a Date back into a string state, so groomDate.split()
            would fail on selection. Convert in both directions."
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes
        run: |
          # A static export cannot contain API routes. The AI synthesis endpoint
          # needs a server and a secret key, so it is dropped from the static site.
          rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "Build exited with $code"
            tail -40 build.log
            tail -60 build.log | grep -vE '^\s*$' | tail -12 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit $code
          fi
          tail -20 build.log

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          du -sh out
          ls out | head -20

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
