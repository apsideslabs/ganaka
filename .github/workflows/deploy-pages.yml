name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes
        run: |
          # A static export cannot contain API routes. The AI synthesis endpoint
          # needs a server and a secret key, so it is dropped from the static site.
          rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: npm run build

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          echo 'apsideslabs.github.io' > out/CNAME.tmp && rm out/CNAME.tmp

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
