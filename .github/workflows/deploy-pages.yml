name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes
        run: |
          # A static export cannot contain API routes. The AI synthesis endpoint
          # needs a server and a secret key, so it is dropped from the static site.
          rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "Build exited with $code"
            echo "--- last 40 lines ---"
            tail -40 build.log
            # Surface the failure through annotations, which are readable via the API.
            tail -60 build.log | grep -vE '^\s*$' | tail -12 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit $code
          fi
          tail -20 build.log

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          ls out | head -20
          du -sh out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
