name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          import pathlib, sys

          changed = []
          missing = []

          def patch(path, pairs):
              p = pathlib.Path(path)
              if not p.exists():
                  missing.append(f'{path} (file not found)')
                  return
              s = p.read_text()
              orig = s
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new)
                  else:
                      missing.append(f'{path}: {old[:70]!r}')
              if s != orig:
                  p.write_text(s)
                  changed.append(path)

          # 1. Matching page: ISO strings passed where Date was expected (fixed earlier).
          mp = pathlib.Path('components/matching/MatchingWorkspaceClient.tsx')
          if mp.exists() and 'isoToDate' not in mp.read_text():
              helpers = '''
          function isoToDate(iso: string): Date | null {
            if (!iso) return null;
            const [y, m, d] = iso.split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d, 12, 0, 0);
          }

          function dateToIso(date: Date | null): string {
            if (!date) return '';
            const pad = (n: number) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
          }
          '''
              s = mp.read_text()
              s = s.replace('export function MatchingWorkspaceClient',
                            helpers + '\nexport function MatchingWorkspaceClient', 1)
              s = s.replace(
                  '<GanakaDatePicker value={groomDate} onChange={setGroomDate} />',
                  '<GanakaDatePicker value={isoToDate(groomDate)} onChange={(d) => setGroomDate(dateToIso(d))} />')
              s = s.replace(
                  '<GanakaDatePicker value={brideDate} onChange={setBrideDate} />',
                  '<GanakaDatePicker value={isoToDate(brideDate)} onChange={(d) => setBrideDate(dateToIso(d))} />')
              mp.write_text(s)
              changed.append(str(mp))

          # 2. Stale location count in the database header comment.
          patch('lib/astronomy/coordinates.ts', [
              (' * 220+ Verified Indian Cities, Pilgrimage Hubs, State Capitals & World Observatories',
               ' * 769 rows (760 unique) verified locations: Indian cities, pilgrimage hubs,\n * state capitals & world observatories.'),
              # 3. Dead search branch: stateOrRegion is never populated in the data,
              #    so filtering on it silently matched nothing.
              ('      (c.stateOrRegion && c.stateOrRegion.toLowerCase().includes(q)) ||\n',
               ''),
          ])

          # 4. Search placeholder on the panchanga page.
          patch('components/panchanga/PanchangaHeader.tsx', [
              ('Search 220+ verified Indian cities, tirthas & global locations...',
               'Search 760 verified cities, tīrthas & global locations...'),
          ])

          # 5. Header comment in the workspace client.
          patch('components/workspace/WorkspaceClient.tsx', [
              (' * 220+ verified Indian cities/tirthas, high-precision classical mechanics, dual chart views,',
               ' * 760 verified cities/tīrthas, high-precision classical mechanics, dual chart views,'),
          ])

          print('changed files:', changed or 'none')
          for m in missing:
              print(f'::warning::not found -> {m}')
          if not changed:
              print('nothing to change')
          PY

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no source changes needed"
          else
            git add -A
            git commit -m "fix: correct stale location count and remove dead state search"
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes
        run: |
          # A static export cannot contain API routes. The AI synthesis endpoint
          # needs a server and a secret key, so it is dropped from the static site.
          rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "Build exited with $code"
            tail -40 build.log
            tail -60 build.log | grep -vE '^\s*$' | tail -12 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit $code
          fi
          tail -20 build.log

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          du -sh out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
