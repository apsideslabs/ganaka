name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install astronomy tooling
        run: pip install --quiet pymeeus==0.5.12 ephem

      - name: Apply source fixes
        run: |
          python3 scripts/fix-sources.py
          python3 scripts/fix-shadbala.py

      - name: Generate planetary and lunar tables
        run: |
          python3 scripts/gen-vsop87.py
          python3 scripts/gen-vsop87-venus.py

      - name: Point the ephemeris at the real theories
        run: |
          python3 scripts/fix-venus.py
          python3 scripts/fix-planets.py

      - name: Verify Venus tables
        run: python3 scripts/check-venus.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the whole ephemeris
        run: python3 scripts/check-ephemeris.py

      - name: Sanity-check shadbala
        run: |
          cat > _sb.ts <<'EOF'
          import { calculateFullJyotishaChart } from './lib/jyotisha/calculator';
          const c: any = calculateFullJyotishaChart({
            year: 2009, month: 3, day: 3, hour: 23, minute: 51, second: 0,
            latitude: 26.637102, longitude: 91.19171, timezoneOffsetHours: 5.5,
            locationName: 'Baghmara, Assam',
          });
          const sb = c.shadbala;
          let bad = 0;
          for (const p of ['sun','moon','mars','mercury','jupiter','venus','saturn']) {
            const r = sb[p];
            const ok = Number.isFinite(r.totalVirupas) && r.totalVirupas > 100 && r.totalVirupas < 1000;
            if (!ok) { console.log(`::error::shadbala out of range for ${p}: ${r.totalVirupas}`); bad++; }
            console.log(`${p.padEnd(8)} sthana ${r.sthanaBala.toFixed(1).padStart(6)} kala ${r.kalaBala.toFixed(1).padStart(6)} chesta ${r.chestaBala.toFixed(1).padStart(5)} drig ${r.drigBala.toFixed(1).padStart(6)} => ${r.totalVirupas.toFixed(1)} virupa rank ${r.rank}`);
          }
          if (!(sb.moon.totalVirupas > sb.jupiter.totalVirupas)) {
            console.log('::error::exalted Moon should out-rank debilitated Jupiter');
            bad++;
          }
          if (bad > 0) process.exit(1);
          EOF
          npx --yes esbuild _sb.ts --bundle --platform=node --format=cjs --outfile=/tmp/sb.cjs --log-level=error
          node /tmp/sb.cjs
          rm -f _sb.ts

      - name: Download GeoNames dumps
        run: |
          mkdir -p /tmp/gn && cd /tmp/gn
          base=https://download.geonames.org/export/dump
          for f in cities5000 cities1000 cities500 IN; do
            curl -sSL --retry 3 --max-time 400 -o $f.zip $base/$f.zip
            unzip -oq $f.zip
          done
          for f in admin1CodesASCII.txt countryInfo.txt timeZones.txt; do
            curl -sSL --retry 3 --max-time 90 -o $f $base/$f
          done

      - name: Build place index
        run: GN_DIR=/tmp/gn node scripts/build-cities.mjs

      - name: Record index stats
        run: |
          node -e "
          const fs=require('fs');
          const path=require('path');
          const f=require('./public/data/cities.json');
          const dir='public/data/in';
          let shards=0,villages=0,shardBytes=0;
          if (fs.existsSync(dir)) {
            for (const n of fs.readdirSync(dir)) {
              shards++;
              const p=path.join(dir,n);
              shardBytes+=fs.statSync(p).size;
              villages+=JSON.parse(fs.readFileSync(p,'utf8')).cities.length;
            }
          }
          const stats={version:f.v,towns:f.cities.length,indiaTowns:f.cities.filter(c=>c[2]==='India').length,villageShards:shards,indiaVillages:villages,townBytes:fs.statSync('public/data/cities.json').size,shardBytes,timezones:f.tz.length,generated:new Date().toISOString(),source:'GeoNames cities5000 + India IN.zip (CC BY 4.0)'};
          fs.writeFileSync('CITY-INDEX.json', JSON.stringify(stats,null,2)+'\n');
          console.log(stats);
          "

      - name: Commit source fixes, tables and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: regenerate ephemeris tables and place stats"
            git push
          fi

      - name: Remove server-only API routes
        run: rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "Build exited with $code"
            tail -40 build.log
            tail -80 build.log | grep -vE '^\s*$' | tail -14 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit $code
          fi
          tail -20 build.log

      - name: Assert determinism
        run: |
          # Ignore matches inside a comment (// or a * block line); only real
          # code usage counts.
          hits=$(grep -rn "Math\.random" lib/ --include='*.ts' | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Math.random still present in lib/"
            exit 1
          fi
          echo "no Math.random in lib/"

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          du -sh out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
