name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source fixes
        run: python3 scripts/fix-sources.py

      - name: Download GeoNames dumps
        run: |
          mkdir -p /tmp/gn && cd /tmp/gn
          base=https://download.geonames.org/export/dump
          for f in cities5000 cities1000 cities500 IN; do
            echo "fetching $f.zip"
            curl -sSL --retry 3 --max-time 400 -o $f.zip $base/$f.zip
            unzip -oq $f.zip
          done
          for f in admin1CodesASCII.txt countryInfo.txt timeZones.txt; do
            curl -sSL --retry 3 --max-time 90 -o $f $base/$f
          done

      - name: Build place index
        run: GN_DIR=/tmp/gn node scripts/build-cities.mjs

      - name: Record index stats
        run: |
          node -e "
          const fs=require('fs');
          const path=require('path');
          const f=require('./public/data/cities.json');
          const dir='public/data/in';
          let shards=0,villages=0,shardBytes=0;
          if (fs.existsSync(dir)) {
            for (const n of fs.readdirSync(dir)) {
              shards++;
              const p=path.join(dir,n);
              shardBytes+=fs.statSync(p).size;
              villages+=JSON.parse(fs.readFileSync(p,'utf8')).cities.length;
            }
          }
          const stats={version:f.v,towns:f.cities.length,indiaTowns:f.cities.filter(c=>c[2]==='India').length,villageShards:shards,indiaVillages:villages,townBytes:fs.statSync('public/data/cities.json').size,shardBytes,timezones:f.tz.length,generated:new Date().toISOString(),source:'GeoNames cities5000 + India IN.zip (CC BY 4.0)'};
          fs.writeFileSync('CITY-INDEX.json', JSON.stringify(stats,null,2)+'\n');
          console.log(stats);
          "

      - name: Commit source fixes and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: apply source corrections and refresh place stats"
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes
        run: rm -rf app/api

      - name: Build static site
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/ganaka'
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "Build exited with $code"
            tail -40 build.log
            tail -80 build.log | grep -vE '^\s*$' | tail -14 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit $code
          fi
          tail -20 build.log

      - name: Verify no nondeterminism remains
        run: |
          if grep -rn "Math.random" lib/ --include='*.ts' | grep -v '//'; then
            echo "::error::Math.random still present in lib/"
            exit 1
          fi
          echo "no Math.random in lib/"

      - name: Disable Jekyll
        run: |
          touch out/.nojekyll
          du -sh out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
